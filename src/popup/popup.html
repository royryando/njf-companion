<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NJF Companion</title>
    <link rel="stylesheet" href="../shared/ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand" id="brand"></div>
      <div class="top-right">
        <span id="env-chip"></span>
        <button class="icon-btn" id="open-settings" title="Settings" aria-label="Settings"></button>
      </div>
    </header>
    <nav class="seg hidden" id="tabs" role="tablist">
      <button role="tab" data-view="session" aria-selected="true">Session</button>
      <button role="tab" data-view="history" aria-selected="false">Page history</button>
      <button role="tab" data-view="status" aria-selected="false">Service Status</button>
      <button role="tab" data-view="errors" aria-selected="false">Error APIs<span class="tab-count hidden" id="err-count"></span></button>
    </nav>
    <main id="app" aria-live="polite"></main>
    <footer class="foot" id="foot"></footer>
    <div class="snackbar" id="snackbar" role="status"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
